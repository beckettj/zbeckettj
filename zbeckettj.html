<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beckett Jones – Portfolio</title>
<meta name="description" content="Portfolio of Beckett Jones, math and computer science student at WashU.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #7a7a7a;
    --line: rgba(0, 0, 0, 0.14);
    --panel: rgba(255, 255, 255, 0.9);
    --pad: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0c;
      --fg: #f2f2f2;
      --muted: #8d8d8d;
      --line: rgba(255, 255, 255, 0.18);
      --panel: rgba(12, 12, 12, 0.88);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
  }
  #stage.grabbing { cursor: grabbing; }
  #stage.hovering { cursor: pointer; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(var(--pad), env(safe-area-inset-top, 0px)) max(var(--pad), env(safe-area-inset-right, 0px))
             max(var(--pad), env(safe-area-inset-bottom, 0px)) max(var(--pad), env(safe-area-inset-left, 0px));
  }

  .lbl {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; line-height: 1.45; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .muted { color: var(--muted); }

  button, a { color: inherit; font: inherit; }
  button {
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left; pointer-events: auto;
  }
  a { pointer-events: auto; text-decoration: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .nav button:hover, .nav a:hover { text-decoration: underline; text-underline-offset: 3px; }

  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; column-gap: 24px;
  }
  .brand {
    font-size: clamp(24px, 3.2vw, 38px); font-weight: 500; letter-spacing: -0.045em; line-height: 1;
    text-transform: uppercase;
  }
  .nav { display: flex; gap: clamp(28px, 9vw, 150px); }
  .nav .col { display: flex; flex-direction: column; }
  .clock { text-align: right; }

  .side { position: absolute; top: 50%; transform: translateY(-50%); }
  .side.l { left: max(var(--pad), env(safe-area-inset-left, 0px)); }
  .side.r { right: max(var(--pad), env(safe-area-inset-right, 0px)); }
  .hint {
    position: absolute; left: 0; right: 0; text-align: center;
    bottom: max(var(--pad), env(safe-area-inset-bottom, 0px));
  }

  #tip {
    position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5;
    background: var(--fg); color: var(--bg); padding: 4px 8px; opacity: 0;
    transition: opacity 0.15s; white-space: nowrap;
  }

  /* Panels */
  #panel {
    position: absolute; pointer-events: auto; overflow: auto; z-index: 3;
    right: max(var(--pad), env(safe-area-inset-right, 0px));
    top: 92px; bottom: 56px; width: min(430px, calc(100% - 2 * var(--pad)));
    background: var(--panel); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 20px 22px 26px;
    opacity: 0; visibility: hidden; transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
  }
  #panel.open { opacity: 1; visibility: visible; transform: none; }
  #panel[data-kind="project"] { bottom: auto; max-height: calc(100% - 92px - 56px); }
  #panel[data-kind="works"] { left: max(var(--pad), env(safe-area-inset-left, 0px)); width: auto; }
  #panel .close { display: block; margin: 0 0 22px auto; }
  #panel h2 { font-size: 30px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 8px; }
  #panel p { font-size: 15px; line-height: 1.55; max-width: 62ch; margin-bottom: 14px; }
  #panel img.shot { width: 100%; display: block; margin-bottom: 18px; border: 1px solid var(--line); }
  .meta { margin-bottom: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 22px; }
  .tags span { border: 1px solid var(--line); padding: 3px 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .btn {
    display: inline-block; border: 1px solid var(--fg); padding: 9px 14px;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }
  .pager { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
  .pager button:hover { text-decoration: underline; text-underline-offset: 3px; }

  .list { list-style: none; padding: 0; margin-top: 10px; }
  .list li { border-top: 1px solid var(--line); }
  .list li:last-child { border-bottom: 1px solid var(--line); }
  .list button {
    display: grid; grid-template-columns: 44px 1fr minmax(0, 220px) 52px; align-items: baseline;
    gap: 12px; width: 100%; padding: 16px 0; transition: padding-left 0.2s;
  }
  .list button:hover { padding-left: 10px; }
  .list .t { font-size: clamp(20px, 2.6vw, 30px); letter-spacing: -0.03em; font-weight: 500; line-height: 1.1; }
  .list .y { text-align: right; }
  .linklist { list-style: none; padding: 0; margin: 6px 0 20px; }
  .linklist li { border-top: 1px solid var(--line); }
  .linklist a { display: flex; justify-content: space-between; padding: 12px 0; font-size: 18px; letter-spacing: -0.02em; }
  .linklist a:hover { padding-left: 6px; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 22px; }
  .skills span { border: 1px solid var(--line); padding: 3px 8px; }

  #loader {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: flex; align-items: center; justify-content: center; transition: opacity 0.6s, visibility 0.6s;
  }
  #loader.done { opacity: 0; visibility: hidden; }

  /* Standard (classic) layout */
  #classic { display: none; position: fixed; inset: 0; overflow-y: auto; background: var(--bg); z-index: 10; }
  body.classic #classic { display: block; }
  body.classic #stage, body.classic #ui, body.classic #tip { display: none; }
  .c-wrap { max-width: 1080px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
  .c-head {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
  }
  .c-head .c-wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 56px; flex-wrap: wrap; }
  .c-head .brand { font-size: 22px; }
  .c-nav { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .c-nav button:hover, .c-nav a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .c-toggle { border: 1px solid var(--fg); padding: 6px 10px; transition: background 0.15s, color 0.15s; }
  .c-toggle:hover { background: var(--fg); color: var(--bg); text-decoration: none !important; }
  .c-hero { padding: clamp(56px, 12vw, 140px) 0 clamp(48px, 8vw, 96px); }
  .c-hero h1 { font-size: clamp(44px, 9vw, 118px); font-weight: 500; letter-spacing: -0.055em; line-height: 0.95; margin: 14px 0 28px; }
  .c-hero p { font-size: clamp(17px, 2vw, 21px); line-height: 1.5; max-width: 52ch; margin-bottom: 14px; }
  .c-hero .actions { margin-top: 26px; margin-bottom: 0; }
  .c-sec { padding: clamp(40px, 7vw, 80px) 0; border-top: 1px solid var(--line); }
  .c-sec > .c-wrap > h2 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 500; letter-spacing: -0.04em; margin-bottom: 30px; }
  .c-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 40px 28px; }
  .c-card .shot {
    aspect-ratio: 16 / 10; width: 100%; object-fit: cover; display: block;
    border: 1px solid var(--line); margin-bottom: 14px; background: var(--line);
  }
  .c-card .ph {
    aspect-ratio: 16 / 10; border: 1px solid var(--line); margin-bottom: 14px; padding: 18px;
    display: flex; align-items: flex-end; font-size: 28px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; color: #0a0a0a;
  }
  .c-card h3 { font-size: 22px; font-weight: 500; letter-spacing: -0.03em; margin: 6px 0 6px; }
  .c-card p { font-size: 15px; line-height: 1.55; margin-bottom: 4px; max-width: 60ch; }
  .c-card .tags { margin: 12px 0 14px; }
  .c-card .actions { margin: 0; }
  .c-card .btn { padding: 7px 11px; }
  .c-about { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .c-about p { font-size: 17px; line-height: 1.6; margin-bottom: 14px; max-width: 60ch; }
  .c-foot { padding: 28px 0 calc(40px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  @media (max-width: 800px) { .c-about { grid-template-columns: 1fr; gap: 10px; } }

  @media (max-width: 800px) {
    header { grid-template-columns: 1fr auto; row-gap: 18px; }
    .nav { grid-column: 1 / -1; grid-row: 2; gap: 40px; }
    .side { display: none; }
    #panel { left: max(var(--pad), env(safe-area-inset-left, 0px)); width: auto; top: 130px; bottom: 48px; }
    #panel[data-kind="project"] { top: auto; bottom: 48px; max-height: 46%; }
    .list button { grid-template-columns: 30px 1fr 40px; }
    .list .tg { display: none; }
  }
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>

<div id="ui">
  <header>
    <a class="brand" id="brand" href="#" data-act="home"></a>
    <nav class="nav lbl" aria-label="Main">
      <div class="col">
        <button type="button" data-act="home">Home</button>
        <button type="button" data-act="works">Works [<span id="count"></span>]</button>
        <button type="button" data-act="view" id="viewBtn">View: Standard</button>
      </div>
      <div class="col">
        <button type="button" data-act="about">About</button>
        <button type="button" data-act="contact">Contact</button>
        <a id="resumeLink" href="#" target="_blank" rel="noopener">Resume</a>
      </div>
    </nav>
    <div class="clock lbl"><div id="time"></div><div id="place"></div></div>
  </header>

  <div class="side l lbl" id="labelL"></div>
  <div class="side r lbl" id="labelR"></div>
  <div class="hint lbl muted" id="hint"></div>

  <section id="panel" aria-live="polite"></section>
</div>

<main id="classic"></main>

<div id="tip" class="lbl"></div>
<div id="loader" class="lbl"><span id="loadtxt">Loading</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   EDIT THIS SECTION. Everything below the next big comment can stay as is.
   ===================================================================== */

const SITE = {
  name: 'Beckett Jones',
  role: 'Math + Computer Science Student',
  location: 'St. Louis, MO',
  timezone: 'America/Chicago',       // any IANA timezone, e.g. 'Europe/London', 'Asia/Tokyo'
  email: 'zbeckettj110@gmail.com',
  resume: 'resume.pdf',              // path to your resume file, or a full URL
  about: [
    'I’m a Math and Computer Science student at Washington University in St. Louis (class of 2029) with a minor in Business Analytics, and a member of the varsity track and field team.',
    'I build data tools and full-stack apps: a CRM dashboard for a healthcare client, machine learning models, and a diagnostic toolkit for AI data agents that I’m developing with Google engineers.',
    'Away from the keyboard: poker, skydiving, and a weakness for flags and capitals of the world.'
  ],
  skills: ['JavaScript', 'Python', 'Java', 'SQL', 'C++', 'R', 'React', 'Node.js', 'Express.js',
           'Pandas', 'Scikit-learn', 'BigQuery', 'Databricks', 'Tableau', 'Power BI', 'Git/GitHub'],
  links: [
    { label: 'GitHub',   url: 'https://github.com/beckettj' },
    { label: 'LinkedIn', url: 'https://linkedin.com/in/beckett-jones-wustl' }
  ],
  defaultView: '3d',                 // '3d' or 'standard': what first-time visitors see
  leftLabel: 'Latest work',
  rightLabel: 'Class of 2029',
  hint: 'Scroll or drag to rotate'
};

/* One entry per project. Add or remove entries freely; the 3D shape adjusts itself.
   image: path or URL to a screenshot (landscape works best, about 1600x1000).
          Leave it empty ('') and a generated title card is used instead.
   color: optional background color for the generated title card.
   link / repo: optional buttons in the project panel. */
const PROJECTS = [
  {
    title: 'AgentForensics Toolkit',
    year: '2026',
    role: 'One of six developers, WashU Google Developer Group',
    description: 'A Python module that parses multi-step agent execution traces and classifies where they fail against Google’s five-stage taxonomy, from discovery to aggregation. Built with a Google engineering mentor; presenting to Google’s team in December.',
    tags: ['Python', 'BigQuery Agent Analytics SDK', 'Open source'],
    image: '',
    color: '#d9d4c7'
    // repo: 'https://github.com/beckettj/your-repo-name',
  },
  {
    title: 'Riivo CRM Dashboard',
    year: '2026',
    role: 'Data Science Intern, Riivo.io (Cape Town)',
    description: 'Redesigned a client-facing CRM dashboard and shipped 12 features, including KPI tracking and year-to-date comparisons. Audited 83,631 invoices with SQL, resolving 287 discrepancies, and helped rebuild a 138,000-row database in a day before a client pitch.',
    tags: ['SQL', 'Data visualization', 'CRM'],
    image: '',
    color: '#c7d3d9'
  },
  {
    title: 'Bank Marketing Response Model',
    year: '2026',
    role: 'Machine learning project',
    description: 'A Random Forest classifier trained on 41,188 customers and 52 features to predict who responds to a marketing campaign. It reaches an ROC-AUC of 0.86 and 91% accuracy.',
    tags: ['Python', 'Scikit-learn', 'Databricks'],
    image: '',
    color: '#d9c7c7'
    // repo: 'https://github.com/beckettj/your-repo-name',
  },
  {
    title: 'Custom-Theme Sudoku',
    year: '2026',
    role: 'Full-stack project',
    description: 'A Sudoku game that uses Claude and Pollinations AI to generate custom tiles from any theme you type. An Express.js backend proxies the AI requests so API keys stay server-side.',
    tags: ['JavaScript', 'Express.js', 'Railway', 'Claude API'],
    image: '',
    color: '#cfd9c7'
    // link: 'https://your-app.up.railway.app',
    // repo: 'https://github.com/beckettj/your-repo-name',
  },
  {
    title: 'College Football Scouting Engine',
    year: '2023–24',
    role: 'Data Analytics Intern, Verified Athletics',
    description: 'A Python scouting algorithm over 1M+ student-athlete data points that generates reports for 1,740 college football programs. Automated collection and cleaning across four datasets, replacing a fully manual workflow.',
    tags: ['Python', 'Pandas', 'Selenium', 'BeautifulSoup'],
    image: '',
    color: '#d4c7d9'
  },
  {
    title: 'AI and VR in Education',
    year: '2023',
    role: 'Pioneer Academics Research Program',
    description: 'A 20-page paper, published in Curieux Academic Journal, on how AI, virtual reality, and augmented reality could transform modern education systems. Written under an Oberlin College professor.',
    tags: ['Research', 'Publication'],
    image: '',
    color: '#d9d2c0'
  }
];

/* =====================================================================
   ENGINE. You should not need to change anything below this line.
   ===================================================================== */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const pad2 = (n) => String(n).padStart(2, '0');
  const N = PROJECTS.length;
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const narrow = () => window.innerWidth <= 800;

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const k in (props || {})) {
      const v = props[k];
      if (k === 'class') e.className = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    kids.flat().forEach((c) => {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }

  /* ---------- static text from config ---------- */
  document.title = SITE.name + ' – ' + SITE.role;
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.content = SITE.name + ', ' + SITE.role + '. Selected projects and contact details.';
  $('#brand').textContent = SITE.name;
  $('#count').textContent = N;
  $('#labelL').textContent = SITE.leftLabel;
  $('#labelR').textContent = SITE.rightLabel;
  $('#hint').textContent = '[ ' + SITE.hint + ' ]';
  $('#place').textContent = SITE.location;
  $('#resumeLink').href = SITE.resume;

  function tickClock() {
    const d = new Date();
    let t, z = '';
    try {
      t = new Intl.DateTimeFormat('en-GB', { timeZone: SITE.timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);
      const part = new Intl.DateTimeFormat('en-US', { timeZone: SITE.timezone, timeZoneName: 'shortOffset' }).formatToParts(d).find((p) => p.type === 'timeZoneName');
      z = part ? part.value : '';
    } catch (e) {
      t = d.toLocaleTimeString('en-GB', { hour12: false });
    }
    $('#time').textContent = t + (z ? ' ' + z : '');
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- panels ---------- */
  const panel = $('#panel');
  let kind = null;
  let focus = -1;
  let three = false;
  let view = '3d';

  function closePanel() {
    kind = null; focus = -1;
    panel.classList.remove('open');
  }
  function openPanel(k, nodes) {
    kind = k; focus = -1;
    panel.dataset.kind = k;
    panel.replaceChildren(
      h('button', { type: 'button', class: 'close lbl', 'aria-label': 'Close panel', onclick: closePanel }, 'Close ✕'),
      ...nodes
    );
    panel.scrollTop = 0;
    panel.classList.add('open');
  }

  function openProject(i) {
    i = ((i % N) + N) % N;
    const p = PROJECTS[i];
    const btns = [];
    if (p.link) btns.push(h('a', { class: 'btn lbl', href: p.link, target: '_blank', rel: 'noopener' }, 'View project'));
    if (p.repo) btns.push(h('a', { class: 'btn lbl', href: p.repo, target: '_blank', rel: 'noopener' }, 'Source code'));
    openPanel('project', [
      (!three && p.image) ? h('img', { class: 'shot', src: p.image, alt: p.title + ' screenshot' }) : null,
      h('div', { class: 'meta lbl muted' }, [p.year, p.role].filter(Boolean).join('  /  ')),
      h('h2', null, p.title),
      h('p', null, p.description || ''),
      h('div', { class: 'tags lbl' }, (p.tags || []).map((t) => h('span', null, t))),
      btns.length ? h('div', { class: 'actions' }, btns) : null,
      N > 1 ? h('div', { class: 'pager lbl' },
        h('button', { type: 'button', onclick: () => openProject(i - 1) }, 'Previous'),
        h('span', { class: 'muted' }, pad2(i + 1) + ' / ' + pad2(N)),
        h('button', { type: 'button', onclick: () => openProject(i + 1) }, 'Next')
      ) : null
    ]);
    focus = i;
  }

  function showWorks() {
    openPanel('works', [
      h('div', { class: 'lbl muted' }, 'Selected work'),
      h('ul', { class: 'list' }, PROJECTS.map((p, i) =>
        h('li', null, h('button', { type: 'button', onclick: () => openProject(i) },
          h('span', { class: 'lbl muted' }, pad2(i + 1)),
          h('span', { class: 't' }, p.title),
          h('span', { class: 'lbl tg muted' }, (p.tags || []).slice(0, 3).join(', ')),
          h('span', { class: 'lbl y muted' }, p.year || '')
        ))
      ))
    ]);
  }

  function showAbout() {
    openPanel('about', [
      h('h2', null, SITE.name),
      h('div', { class: 'meta lbl muted' }, SITE.role + '  /  ' + SITE.location),
      ...SITE.about.map((t) => h('p', null, t)),
      SITE.skills && SITE.skills.length ? h('div', { class: 'skills lbl' }, SITE.skills.map((s) => h('span', null, s))) : null,
      h('div', { class: 'actions' }, h('a', { class: 'btn lbl', href: SITE.resume, target: '_blank', rel: 'noopener' }, 'Open resume'))
    ]);
  }

  function showContact() {
    openPanel('contact', [
      h('h2', null, 'Get in touch'),
      h('p', null, 'The fastest way to reach me is email.'),
      h('ul', { class: 'linklist' },
        h('li', null, h('a', { href: 'mailto:' + SITE.email }, h('span', null, SITE.email), h('span', { class: 'lbl muted' }, 'Email'))),
        ...(SITE.links || []).map((l) =>
          h('li', null, h('a', { href: l.url, target: '_blank', rel: 'noopener' }, h('span', null, l.label), h('span', { class: 'lbl muted' }, 'Open'))))
      ),
      h('div', { class: 'actions' }, h('a', { class: 'btn lbl', href: SITE.resume, target: '_blank', rel: 'noopener' }, 'Open resume'))
    ]);
  }

  document.querySelectorAll('[data-act]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const a = el.dataset.act;
      if (a === 'home') closePanel();
      else if (a === 'works') showWorks();
      else if (a === 'about') showAbout();
      else if (a === 'contact') showContact();
      else if (a === 'view') setView('standard');
    });
  });

  /* ---------- standard layout ---------- */
  const classic = $('#classic');
  function goTo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
  }

  function buildClassic() {
    const first = SITE.about && SITE.about[0] ? SITE.about[0] : '';
    const links = [h('a', { class: 'btn lbl', href: SITE.resume, target: '_blank', rel: 'noopener' }, 'Open resume'),
                   h('a', { class: 'btn lbl', href: 'mailto:' + SITE.email }, 'Email me')];

    const cards = PROJECTS.map((p) => {
      const btns = [];
      if (p.link) btns.push(h('a', { class: 'btn lbl', href: p.link, target: '_blank', rel: 'noopener' }, 'View project'));
      if (p.repo) btns.push(h('a', { class: 'btn lbl', href: p.repo, target: '_blank', rel: 'noopener' }, 'Source code'));
      const visual = p.image
        ? h('img', { class: 'shot', src: p.image, alt: p.title + ' screenshot', loading: 'lazy',
            onerror: (e) => { const d = h('div', { class: 'ph', style: 'background:' + (p.color || '#d9d4c7') }, p.title); e.target.replaceWith(d); } })
        : h('div', { class: 'ph', style: 'background:' + (p.color || '#d9d4c7') }, p.title);
      return h('article', { class: 'c-card' },
        visual,
        h('div', { class: 'lbl muted' }, [p.year, p.role].filter(Boolean).join('  /  ')),
        h('h3', null, p.title),
        h('p', null, p.description || ''),
        h('div', { class: 'tags lbl' }, (p.tags || []).map((t) => h('span', null, t))),
        btns.length ? h('div', { class: 'actions' }, btns) : null
      );
    });

    classic.replaceChildren(
      h('header', { class: 'c-head' }, h('div', { class: 'c-wrap' },
        h('a', { class: 'brand', href: '#top', onclick: (e) => { e.preventDefault(); classic.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); } }, SITE.name),
        h('nav', { class: 'c-nav lbl', 'aria-label': 'Sections' },
          h('button', { type: 'button', onclick: () => goTo('c-projects') }, 'Projects'),
          h('button', { type: 'button', onclick: () => goTo('c-about') }, 'About'),
          h('button', { type: 'button', onclick: () => goTo('c-contact') }, 'Contact'),
          h('a', { href: SITE.resume, target: '_blank', rel: 'noopener' }, 'Resume'),
          three ? h('button', { type: 'button', class: 'c-toggle', onclick: () => setView('3d') }, 'View: 3D') : null
        )
      )),
      h('section', { class: 'c-hero' }, h('div', { class: 'c-wrap' },
        h('div', { class: 'lbl muted' }, SITE.role + '  /  ' + SITE.location),
        h('h1', null, SITE.name),
        h('p', null, first),
        h('div', { class: 'actions' }, links)
      )),
      h('section', { class: 'c-sec', id: 'c-projects' }, h('div', { class: 'c-wrap' },
        h('h2', null, 'Projects'),
        h('div', { class: 'c-grid' }, cards)
      )),
      h('section', { class: 'c-sec', id: 'c-about' }, h('div', { class: 'c-wrap' },
        h('h2', null, 'About'),
        h('div', { class: 'c-about' },
          h('div', null, (SITE.about || []).map((t) => h('p', null, t))),
          h('div', null,
            h('div', { class: 'lbl muted' }, 'Skills'),
            h('div', { class: 'skills lbl', style: 'margin-top:10px' }, (SITE.skills || []).map((s) => h('span', null, s)))
          )
        )
      )),
      h('section', { class: 'c-sec', id: 'c-contact' }, h('div', { class: 'c-wrap' },
        h('h2', null, 'Contact'),
        h('ul', { class: 'linklist', style: 'max-width:560px' },
          h('li', null, h('a', { href: 'mailto:' + SITE.email }, h('span', null, SITE.email), h('span', { class: 'lbl muted' }, 'Email'))),
          ...(SITE.links || []).map((l) =>
            h('li', null, h('a', { href: l.url, target: '_blank', rel: 'noopener' }, h('span', null, l.label), h('span', { class: 'lbl muted' }, 'Open'))))
        )
      )),
      h('footer', { class: 'c-foot' }, h('div', { class: 'c-wrap lbl muted' }, SITE.name + '  /  ' + SITE.role))
    );
  }

  function setView(v) {
    if (v === '3d' && !three) v = 'standard';
    view = v;
    document.body.classList.toggle('classic', v === 'standard');
    if (v === 'standard') closePanel();
    try { localStorage.setItem('portfolio-view', v); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- 3D ---------- */
  const loader = $('#loader');
  const hideLoader = () => loader.classList.add('done');

  function initThree() {
    if (typeof THREE === 'undefined' || N === 0) return false;
    const canvas = $('#stage');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    } catch (e) { return false; }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    const root = new THREE.Group();
    scene.add(root);

    const W = 1.7, H = W * 640 / 1024;
    const TWIST = 1.0;
    const inner = 0.25 + N * 0.045;

    const fg = () => getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#0a0a0a';

    function placeholderCanvas(p, i) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 640;
      const g = c.getContext('2d');
      g.fillStyle = p.color || ('hsl(' + ((i * 47 + 30) % 360) + ' 22% 84%)');
      g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = 'rgba(0,0,0,0.78)';
      g.font = '500 92px "Helvetica Neue", Helvetica, Arial, sans-serif';
      g.textBaseline = 'alphabetic';
      // wrap title to at most two lines
      const words = p.title.split(' ');
      const lines = []; let line = '';
      words.forEach((w) => {
        const test = line ? line + ' ' + w : w;
        if (g.measureText(test).width > 880 && line) { lines.push(line); line = w; } else line = test;
      });
      lines.push(line);
      lines.slice(0, 2).forEach((l, k) => g.fillText(l, 56, 400 + k * 100 - (Math.min(lines.length, 2) - 1) * 100));
      g.font = '500 28px ui-monospace, Menlo, Consolas, monospace';
      g.fillText((p.tags || []).slice(0, 3).join('  /  ').toUpperCase(), 56, 574);
      g.textAlign = 'right';
      g.fillText(p.year || '', 968, 90);
      g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 2;
      g.strokeRect(20, 20, c.width - 40, c.height - 40);
      return c;
    }

    function makeTexture(c) {
      const t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }

    function loadProjectTexture(p) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => {
          const c = document.createElement('canvas');
          c.width = 1024; c.height = 640;
          const g = c.getContext('2d');
          const s = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight);
          const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
          g.drawImage(im, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
          resolve(makeTexture(c));
        };
        im.onerror = reject;
        im.src = p.image;
      });
    }

    const geo = new THREE.PlaneGeometry(W, H);
    const cards = PROJECTS.map((p, i) => {
      const pivot = new THREE.Group();
      pivot.rotation.y = (i / N) * Math.PI * 2;
      const mat = new THREE.MeshBasicMaterial({
        map: makeTexture(placeholderCanvas(p, i)), side: THREE.DoubleSide, transparent: true
      });
      const mesh = new THREE.Mesh(geo, mat);
      const baseX = inner + W / 2;
      const baseY = Math.sin(i * 2.1) * 0.32;
      mesh.position.set(baseX, baseY, 0);
      mesh.userData = {
        i, baseX, hover: 0, flat: 0,
        tiltX: Math.sin(i * 1.3) * 0.2,
        tiltZ: Math.sin(i * 0.9) * 0.1
      };
      mesh.rotation.set(mesh.userData.tiltX, TWIST, mesh.userData.tiltZ);
      pivot.add(mesh);
      root.add(pivot);
      return mesh;
    });

    // swap in real screenshots as they load; keep the title card on failure
    let loaded = 0;
    const total = PROJECTS.filter((p) => p.image).length;
    const update = () => { $('#loadtxt').textContent = 'Loading [ ' + loaded + ' / ' + total + ' ]'; };
    update();
    const jobs = PROJECTS.map((p, i) => {
      if (!p.image) return Promise.resolve();
      return loadProjectTexture(p).then((t) => {
        cards[i].material.map = t; cards[i].material.needsUpdate = true;
      }).catch(() => {
        console.warn('Could not load image for "' + p.title + '": ' + p.image + ' (using title card instead)');
      }).then(() => { loaded++; update(); });
    });
    Promise.all(jobs).then(() => setTimeout(hideLoader, 250));
    setTimeout(hideLoader, 4000);

    /* sizing */
    let baseZ = 7;
    function resize() {
      const w = window.innerWidth, hgt = window.innerHeight;
      renderer.setSize(w, hgt, false);
      camera.aspect = w / hgt;
      camera.updateProjectionMatrix();
      baseZ = Math.max(6.8, 6.0 / camera.aspect);
    }
    window.addEventListener('resize', resize);
    resize();

    /* input */
    const ray = new THREE.Raycaster();
    const ptr = new THREE.Vector2(0, 0);
    const state = { active: false, x: 0, y: 0 };
    let dragging = false, moved = 0, lastX = 0, lastInput = performance.now();
    let rot = 0, rotTarget = 0, hoverIdx = -1;
    const tip = $('#tip');

    function setPointer(e) {
      state.x = e.clientX; state.y = e.clientY;
      ptr.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    }
    function pick() {
      ray.setFromCamera(ptr, camera);
      const hits = ray.intersectObjects(cards, false);
      return hits.length ? hits[0].object.userData.i : -1;
    }

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; moved = 0; lastX = e.clientX; setPointer(e); state.active = true;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('grabbing');
      lastInput = performance.now();
    });
    canvas.addEventListener('pointermove', (e) => {
      setPointer(e); state.active = true;
      if (dragging) {
        const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
        if (focus < 0) rotTarget += dx * 0.007;
        lastInput = performance.now();
      }
    });
    canvas.addEventListener('pointerup', (e) => {
      canvas.classList.remove('grabbing');
      const wasClick = dragging && moved < 6;
      dragging = false;
      setPointer(e);
      if (wasClick) {
        const i = pick();
        if (i >= 0) openProject(i); else if (kind === 'project') closePanel();
      }
      if (e.pointerType !== 'mouse') state.active = false;
    });
    canvas.addEventListener('pointerleave', () => { state.active = false; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (focus >= 0) return;
      rotTarget += (e.deltaY + e.deltaX) * 0.0025;
      lastInput = performance.now();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
      else if (view === 'standard') return;
      else if (e.key === 'ArrowRight') { if (focus >= 0) openProject(focus + 1); else rotTarget += (Math.PI * 2) / N; }
      else if (e.key === 'ArrowLeft') { if (focus >= 0) openProject(focus - 1); else rotTarget -= (Math.PI * 2) / N; }
      lastInput = performance.now();
    });

    /* loop */
    const damp = (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt));
    const wp = new THREE.Vector3(), nrm = new THREE.Vector3(), tmp = new THREE.Vector3();
    const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3(), look = new THREE.Vector3();
    camera.position.set(0, 0, baseZ * 1.6);
    let last = performance.now();

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (view === 'standard') return;

      if (focus < 0) {
        if (!dragging && !RM && now - lastInput > 2500) rotTarget += dt * 0.12;
        rot = damp(rot, rotTarget, 5, dt);
      }
      root.rotation.y = rot;
      root.rotation.x = damp(root.rotation.x, focus >= 0 ? 0 : 0.14 + ptr.y * 0.08, 4, dt);
      root.rotation.z = damp(root.rotation.z, focus >= 0 ? 0 : -0.05, 4, dt);

      hoverIdx = (focus < 0 && !dragging && state.active && kind === null) ? pick() : -1;
      canvas.classList.toggle('hovering', hoverIdx >= 0);
      if (hoverIdx >= 0) {
        const p = PROJECTS[hoverIdx];
        tip.textContent = p.title + (p.year ? '  ' + p.year : '');
        tip.style.transform = 'translate(' + (state.x + 14) + 'px,' + (state.y + 16) + 'px)';
        tip.style.opacity = 1;
      } else tip.style.opacity = 0;

      cards.forEach((m, i) => {
        const u = m.userData;
        u.hover = damp(u.hover, i === hoverIdx ? 1 : 0, 10, dt);
        u.flat = damp(u.flat, i === focus ? 1 : 0, 6, dt);
        m.position.x = u.baseX + u.hover * 0.22;
        m.scale.setScalar(1 + u.hover * 0.1);
        m.rotation.x = u.tiltX * (1 - u.flat);
        m.rotation.z = u.tiltZ * (1 - u.flat);
        const op = (focus >= 0 && i !== focus) ? 0.08 : 1;
        m.material.opacity = damp(m.material.opacity, op, 6, dt);
      });

      if (focus >= 0) {
        const m = cards[focus];
        m.updateWorldMatrix(true, false);
        m.getWorldPosition(wp);
        nrm.set(0, 0, 1).transformDirection(m.matrixWorld);
        if (nrm.dot(tmp.copy(camera.position).sub(wp)) < 0) nrm.negate();
        const dist = Math.max(3.2, 3.4 / camera.aspect);
        camTarget.copy(wp).addScaledVector(nrm, dist);
        if (narrow()) {
          lookTarget.copy(wp).add(tmp.set(0, -dist * 0.2, 0));
        } else {
          tmp.copy(nrm).negate().cross(camera.up).normalize();
          lookTarget.copy(wp).addScaledVector(tmp, dist * 0.728 * camera.aspect * 0.2);
        }
      } else {
        camTarget.set(ptr.x * 0.5, ptr.y * 0.3, baseZ);
        lookTarget.set(0, 0, 0);
      }
      const k = 1 - Math.exp(-(focus >= 0 ? 4 : 3) * dt);
      camera.position.lerp(camTarget, k);
      look.lerp(lookTarget, k);
      camera.lookAt(look);

      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
    return true;
  }

  three = initThree();
  buildClassic();
  if (!three) {
    $('#viewBtn').hidden = true;
    hideLoader();
    setView('standard');
  } else {
    let start = SITE.defaultView === 'standard' ? 'standard' : '3d';
    try {
      const saved = localStorage.getItem('portfolio-view');
      if (saved === '3d' || saved === 'standard') start = saved;
    } catch (e) { /* ignore */ }
    const q = new URLSearchParams(location.search).get('view');
    if (q === 'standard' || q === '3d') start = q;
    if (RM && !q) start = 'standard';
    setView(start);
  }
})();
</script>
</body>
</html>
